name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:sdk
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openreel_test
          POSTGRES_USER: openreel
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openreel"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r apps/api/requirements.txt -e packages/python-sdk -e packages/mcp-server
      - run: pip check
      - run: pip install pip-audit && pip-audit --progress-spinner off
      - run: ruff check apps/api packages/python-sdk packages/mcp-server tests
      - name: Backend, migrations, media engine, SDK, MCP
        env:
          PYTHONPATH: apps/api
          TEST_DATABASE_URL: "${{ matrix.database == 'postgres' && 'postgresql+psycopg://openreel:ci-only-test-password@localhost:5432/openreel_test' || '' }}"
        run: pytest -q apps/api/tests tests
