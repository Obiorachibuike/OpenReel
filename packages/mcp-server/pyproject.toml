[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "openreel-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic==2.14.1", "mcp==2.3.0", "sse-starlette==3.6.0", "openreel-sdk>=0.1.0"]
[project.scripts]
openreel-mcp = "openreel_mcp:main"
[tool.setuptools]
py-modules = ["openreel_mcp"]
